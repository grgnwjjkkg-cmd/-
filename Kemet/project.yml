name: Kemet
options:
  bundleIdPrefix: com.example
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kemet:
    type: application
    platform: iOS
    sources:
      - path: App
      # ゲーム本体はフォルダごと同梱（Game/index.html を WebView で開く）
      - path: Game
        type: folder
        buildPhase: resources
    settings:
      base:
        # 自分の Bundle ID と Team に変えてください
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kemet
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ケメトの秘宝
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Kemet:
    build:
      targets:
        Kemet: all
    run:
      config: Debug
    archive:
      config: Release
