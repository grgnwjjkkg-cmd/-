name: Oshitabi
options:
  bundleIdPrefix: com.example
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Oshitabi:
    type: application
    platform: iOS
    sources:
      - path: Oshitabi
        excludes:
          - "Resources/Sprites/**"
      # キャラ画像はフォルダごと入れる（Sprites/<id>/xxx.webp のまま読む）
      - path: Oshitabi/Resources/Sprites
        type: folder
        buildPhase: resources
    settings:
      base:
        # 自分の Bundle ID と Team に変えてください
        PRODUCT_BUNDLE_IDENTIFIER: com.example.oshitabi
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: オシタビ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  OshitabiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OshitabiTests
    dependencies:
      - target: Oshitabi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.oshitabi.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Oshitabi:
    build:
      targets:
        Oshitabi: all
        OshitabiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OshitabiTests
    archive:
      config: Release
